    <nav class="tabs" aria-label="Sections">

    <button class="btn ghost menu-btn" id="btn-menu" type="button" aria-expanded="false" aria-controls="top-actions" aria-label="Menu du projet">⋯</button>
    <div class="top-actions" id="top-actions">
      <a class="btn ghost" href="../documentation.html" target="_blank" rel="noopener" title="Guide d'utilisation, modèles mécanique et physiologique, simulation et algorithmes d'optimisation">Documentation</a>
      <button class="btn ghost" id="btn-export-project" title="Enregistrer tout le projet dans un fichier">Exporter</button>
      <label class="btn ghost" title="Ouvrir un projet enregistré">Importer<input type="file" id="input-import-project" accept=".json,application/json" hidden></label>

    </div>

  <main class="layout">
    <section class="stage">
      <div class="map-wrap">
        <div id="map" aria-label="Carte"></div>

        <!-- alerte de course (incident, fringale, arrivée…) : seul élément du jeu qui reste sur la carte -->
        <div class="hud-banner" id="hud-banner" hidden></div>
        <!-- mode jeu : décompte avant le départ (réglage « Décompte avant le départ »), au centre de l'écran de course -->
        <div class="game-countdown" id="game-countdown" role="status" aria-live="polite" hidden></div>

        <div class="map-status" id="map-status" hidden></div>
        <!-- course en direct : demandes d'accès à valider (organisateur) -->
        <div class="live-requests" id="live-requests" hidden aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="credit">Réalisée par <a href="mailto:hugo.joudrier@gmail.com">Hugo Joudrier-Faure</a></footer>
  <!-- compteur : plein écran, par-dessus le reste (js/ui/tab-ride.js) -->

  <div class="toasts" id="toasts" aria-live="polite"></div>
