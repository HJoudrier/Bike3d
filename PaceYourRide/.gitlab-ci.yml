# The Docker image that will be used to build your app
image: busybox:latest
create-pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r css js vendor img public/
    # L'accueil est la page d'ouverture du site (index.html) ; l'éditeur est publié sous editeur.html. Les liens de l'un vers l'autre sont réécrits.
    - cp accueil.html public/index.html
    - cp index.html public/editeur.html
    - sed -i 's|href="index\.html|href="editeur.html|g; s|href="accueil\.html"|href="index.html"|g' public/index.html
    - sed -i 's|href="accueil\.html"|href="index.html"|g' public/editeur.html
    - sed -i 's|index\.html|editeur.html|g' public/js/home.js
    # Documentation (liens « Documentation » de l'accueil et de l'éditeur) et rapport du modèle physiologique
    - cp documentation.html DocModelePhysioCycliste.html public/
    - sed -i 's|href="accueil\.html"|href="index.html"|g' public/documentation.html
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
