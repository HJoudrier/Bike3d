# The Docker image that will be used to build your app
image: busybox:latest
create-pages:
  stage: deploy
  script:
    - mkdir -p public
    # Le site tel quel, depuis sa racine : le portail (index.html) et les quatre applications indépendantes, PaceYourRide, VirtualRide2D, VirtualRide3D (avec
    # l'univers 3D de Bike3D) et Compteur, qui partagent le dossier Commun (moteur, interface, styles, bibliothèques)
    - cp -r index.html Commun PaceYourRide VirtualRide2D VirtualRide3D Compteur public/
    # sources de développement, inutiles en ligne
    - rm -rf public/VirtualRide3D/univers/tools public/PaceYourRide/tools public/PaceYourRide/img_bike
  pages:
    # The folder that contains the files to be exposed at the Page URL
    publish: public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
